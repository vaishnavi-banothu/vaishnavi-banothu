<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Messages | NeedBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-light">

  <div id="nb-navbar-mount"></div>

  <main class="main-content py-4">
    <div class="container">
      
      <!-- Safe Messaging Header Banner -->
      <div class="card p-3 mb-3 border-0 bg-white shadow-sm rounded-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-shield-lock-fill text-teal fs-4"></i>
            <div>
              <h5 class="fw-bold text-primary-navy mb-0">NeedBridge Safe Community Messaging</h5>
              <div class="text-muted small">Coordinate help safely. Avoid sharing financial passwords, bank OTPs, or private street addresses.</div>
            </div>
          </div>
          <a href="dashboard.html" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
          </a>
        </div>
      </div>

      <!-- MAIN CHAT INTERFACE -->
      <div class="chat-container">
        
        <!-- SIDEBAR CONVERSATIONS LIST -->
        <div class="chat-sidebar">
          <div class="p-3 border-bottom bg-white">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
              <input type="text" id="chat-search" class="form-control border-start-0 bg-light" placeholder="Search conversations...">
            </div>
          </div>

          <div id="chat-conversations-list" style="flex:1; overflow-y:auto;">
            <!-- Populated dynamically -->
          </div>
        </div>

        <!-- MAIN ACTIVE CHAT WINDOW -->
        <div class="chat-main" id="chat-window-wrapper">
          
          <!-- Chat Header -->
          <div class="p-3 border-bottom d-flex align-items-center justify-content-between bg-white" id="chat-header">
            <div class="d-flex align-items-center gap-3">
              <img id="chat-active-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" class="rounded-circle" style="width: 42px; height: 42px; object-fit: cover;">
              <div>
                <h6 class="fw-bold text-primary-navy mb-0" id="chat-active-name">Select a conversation</h6>
                <div class="text-muted small" id="chat-active-status"><i class="bi bi-circle-fill text-success" style="font-size:0.6rem;"></i> Active on NeedBridge</div>
              </div>
            </div>
          </div>

          <!-- Messages Scrollable Area -->
          <div class="chat-messages-area" id="chat-messages-container">
            <div class="text-center text-muted my-auto py-5">
              <i class="bi bi-chat-heart text-teal fs-1"></i>
              <div class="fw-bold mt-2">Private Community Messaging</div>
              <div class="small">Select a conversation from the left or contact someone through a listing.</div>
            </div>
          </div>

          <!-- Message Input Bar -->
          <div class="p-3 border-top bg-white" id="chat-input-bar">
            <form id="form-send-message" class="d-flex gap-2">
              <input type="text" id="chat-input-text" class="form-control" placeholder="Type your message here..." autocomplete="off" required>
              <button type="submit" class="btn btn-teal-custom px-4" id="btn-send-msg">
                <i class="bi bi-send-fill"></i>
              </button>
            </form>
          </div>

        </div>

      </div>

    </div>
  </main>

  <div id="nb-footer-mount"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/app.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
